<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Private Space ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary-pink: #ff85a2;
            --soft-bg: #fff0f3;
            --chat-bubble-me: #ffb3c1;
            --chat-bubble-you: #ffffff;
            --text-color: #4a4a4a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--soft-bg);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Password & Name Overlay */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--soft-bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.5s ease;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 133, 162, 0.2);
            text-align: center;
            width: 300px;
        }

        /* Floating Hearts Animation */
        .hearts-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            color: var(--primary-pink);
            font-size: 20px;
            animation: float 6s linear infinite;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Chat Container */
        .chat-container {
            width: 95%;
            max-width: 400px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 133, 162, 0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1;
            border: 2px solid white;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .chat-header {
            padding: 20px;
            background: var(--primary-pink);
            color: white;
            text-align: center;
            font-weight: 600;
        }

        .online-status { font-size: 12px; opacity: 0.9; margin-top: 5px; }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: none;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 0.9rem;
            position: relative;
            word-wrap: break-word;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .message.me { align-self: flex-end; background: var(--primary-pink); color: white; border-bottom-right-radius: 4px; }
        .message.you { align-self: flex-start; background: white; color: var(--text-color); border-bottom-left-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .sender-name { font-size: 10px; font-weight: 600; margin-bottom: 2px; display: block; opacity: 0.8; }
        .message-time { font-size: 9px; opacity: 0.7; margin-top: 4px; text-align: right; }

        .chat-input-area { padding: 15px; background: white; display: flex; gap: 10px; border-top: 1px solid #f0f0f0; }
        
        input {
            flex: 1;
            border: 1px solid #eee;
            padding: 10px 15px;
            border-radius: 20px;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        button {
            background: var(--primary-pink);
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        .error-msg { color: #ff4d7d; font-size: 0.8rem; margin-top: 10px; display: none; }
        .typing-indicator { font-size: 11px; color: var(--primary-pink); padding: 5px 20px; font-style: italic; }
    </style>
</head>
<body>

    <div class="hearts-bg" id="hearts-container"></div>

    <div id="login-overlay">
        <div class="login-card">
            <h2 style="color: var(--primary-pink); margin-bottom: 20px;">Welcome Back ❤️</h2>
            
            <input type="password" id="pass-input" placeholder="Enter Secret Code" style="text-align: center; margin-bottom: 15px; width: 100%;">
            <input type="text" id="name-input" placeholder="Your Name" style="text-align: center; margin-bottom: 15px; width: 100%;">
            
            <button onclick="checkAccess()" style="width: 100%;">Enter Space</button>
            <p id="error" class="error-msg">Check code or name! ❤️</p>
        </div>
    </div>

    <div class="chat-container" id="main-chat">
        <div class="chat-header">
            💖 Our Sweet Chat 💖
            <div class="online-status" id="online-status">Connecting...</div>
        </div>
        <div id="chat-box"></div>
        <div class="typing-indicator" id="typingIndicator" style="display: none;"></div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR ACTUAL FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_APP.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_APP.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let userName = "";
        let userId = localStorage.getItem('chat_uid') || 'id_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chat_uid', userId);

        function checkAccess() {
            const pass = document.getElementById('pass-input').value;
            const name = document.getElementById('name-input').value.trim();
            
            if (pass === "12321" && name !== "") {
                userName = name;
                document.getElementById('login-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('main-chat').style.display = 'flex';
                    startChat();
                }, 500);
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 600);

        function startChat() {
            document.getElementById('online-status').innerText = "Connected 💕";

            // Load Messages
            db.collection('messages').orderBy('timestamp', 'asc').onSnapshot(snap => {
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = '';
                snap.forEach(doc => {
                    const data = doc.data();
                    const isMe = data.uid === userId;
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${isMe ? 'me' : 'you'}`;
                    
                    const time = data.timestamp ? data.timestamp.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...';
                    
                    msgDiv.innerHTML = `
                        <span class="sender-name">${isMe ? 'Me' : data.name}</span>
                        ${data.text}
                        <div class="message-time">${time}</div>
                    `;

                    if (isMe) {
                        msgDiv.onclick = () => { if(confirm("Delete?")) db.collection('messages').doc(doc.id).delete(); };
                    }

                    chatBox.appendChild(msgDiv);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            // Typing Logic
            const input = document.getElementById('user-input');
            input.addEventListener('input', () => {
                db.collection('status').doc('typing').set({ name: userName, uid: userId, active: true });
                clearTimeout(window.tType);
                window.tType = setTimeout(() => db.collection('status').doc('typing').set({ active: false }), 2000);
            });

            db.collection('status').doc('typing').onSnapshot(doc => {
                const data = doc.data();
                const indicator = document.getElementById('typingIndicator');
                if (data && data.active && data.uid !== userId) {
                    indicator.innerText = `${data.name} is typing...`;
                    indicator.style.display = 'block';
                } else {
                    indicator.style.display = 'none';
                }
            });
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            db.collection('messages').add({
                text: text,
                name: userName,
                uid: userId,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            input.value = '';
            db.collection('status').doc('typing').set({ active: false });
        }

        document.getElementById('user-input').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
