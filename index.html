<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Private Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff85a2;
            --soft-bg: #fff0f3;
            --chat-bubble-me: #ffb3c1;
            --chat-bubble-you: #ffffff;
            --text-color: #4a4a4a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--soft-bg);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Password Overlay */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--soft-bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.5s ease;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 133, 162, 0.2);
            text-align: center;
            width: 280px;
        }

        /* Floating Hearts Animation */
        .hearts-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            color: var(--primary-pink);
            font-size: 20px;
            animation: float 6s linear infinite;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Chat Container */
        .chat-container {
            width: 90%;
            max-width: 400px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 133, 162, 0.2);
            display: none; /* Hidden until login */
            flex-direction: column;
            overflow: hidden;
            z-index: 1;
            border: 2px solid white;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .chat-header {
            padding: 20px;
            background: var(--primary-pink);
            color: white;
            text-align: center;
            font-weight: 600;
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: none;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .message.me { align-self: flex-end; background: var(--chat-bubble-me); color: white; border-bottom-right-radius: 5px; }
        .message.you { align-self: flex-start; background: var(--chat-bubble-you); color: var(--text-color); border-bottom-left-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .chat-input-area { padding: 20px; background: white; display: flex; gap: 10px; }
        
        input {
            flex: 1;
            border: 1px solid #eee;
            padding: 12px;
            border-radius: 20px;
            outline: none;
            font-family: inherit;
        }

        button {
            background: var(--primary-pink);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.05); }

        .error-msg { color: #ff4d7d; font-size: 0.8rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="hearts-bg" id="hearts-container"></div>

    <div id="login-overlay">
        <div class="login-card">
            <h2 style="color: var(--primary-pink); margin-bottom: 15px;">Enter Code</h2>
            <input type="password" id="pass-input" placeholder="Hint: Our secret..." style="text-align: center; margin-bottom: 10px;">
            <button onclick="checkPassword()" style="width: 100%;">Open Heart</button>
            <p id="error" class="error-msg">Incorrect code, try again! ❤️</p>
        </div>
    </div>

    <div class="chat-container" id="main-chat">
        <div class="chat-header">💖 Our Sweet Chat 💖</div>
        <div id="chat-box">
            <div class="message you">Welcome home, beautiful! ✨</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Password Check Logic
        function checkPassword() {
            const pass = document.getElementById('pass-input').value;
            if (pass === "12321") {
                document.getElementById('login-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('main-chat').style.display = 'flex';
                }, 500);
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        // Generate Hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 500);

        // Chat Logic
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        window.onload = () => {
            const savedMessages = JSON.parse(localStorage.getItem('messages')) || [];
            savedMessages.forEach(msg => appendMessage(msg.text, msg.type, false));
        };

        function sendMessage() {
            const text = userInput.value.trim();
            if (text === "") return;
            appendMessage(text, 'me', true);
            userInput.value = "";
        }

        function appendMessage(text, type, save) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', type);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            if (save) {
                const messages = JSON.parse(localStorage.getItem('messages')) || [];
                messages.push({ text, type });
                localStorage.setItem('messages', JSON.stringify(messages));
            }
        }

        // Allow Enter key
        document.getElementById('pass-input').addEventListener("keypress", (e) => { if (e.key === "Enter") checkPassword(); });
        userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
