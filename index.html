<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Private Space ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary-pink: #ff85a2;
    --soft-bg: #fff0f3;
    --text-color: #4a4a4a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Poppins', sans-serif;
    background: var(--soft-bg);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* LOGIN */
#login-overlay {
    position: fixed;
    inset: 0;
    background: var(--soft-bg);
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 20px;
    border: 1px solid #ddd;
}

/* CHAT */
.chat-container {
    width: 95%;
    max-width: 400px;
    height: 85vh;
    background: white;
    border-radius: 20px;
    display: none;
    flex-direction: column;
}

.chat-header {
    background: var(--primary-pink);
    color: white;
    padding: 15px;
    text-align: center;
}

#chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

/* MESSAGES */
.message {
    max-width: 75%;
    padding: 10px;
    border-radius: 15px;
    margin-bottom: 10px;
}

.me {
    background: var(--primary-pink);
    color: white;
    margin-left: auto;
}

.you {
    background: #eee;
}

.sender {
    font-size: 10px;
    display: block;
}

/* INPUT */
.chat-input {
    display: flex;
    padding: 10px;
}

button {
    background: var(--primary-pink);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-overlay">
    <div class="login-card">
        <h2>Enter ❤️</h2>
        <input type="password" id="pass-input" placeholder="Code (12321)">
        <input type="text" id="name-input" placeholder="Your Name">
        <button onclick="checkAccess()">Join</button>
    </div>
</div>

<!-- CHAT -->
<div class="chat-container" id="main-chat">
    <div class="chat-header">💖 Private Chat 💖</div>

    <div id="chat-box"></div>

    <div class="chat-input">
        <input type="text" id="user-input" placeholder="Message..." style="flex:1">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZJ8aPqmIJBt-pQPW3xCRrRI5aMV0tza9_p-6zcmfbaeg8UDpvoAY-W9eSvdk9GLVM/exec";

let userName = "";

/* LOGIN */
function checkAccess() {
    const pass = document.getElementById('pass-input').value;
    const name = document.getElementById('name-input').value.trim();

    if (pass === "12321" && name !== "") {
        userName = name;
        document.getElementById('login-overlay').style.display = "none";
        document.getElementById('main-chat').style.display = "flex";

        loadMessages();
        setInterval(loadMessages, 3000);
    } else {
        alert("Wrong code or name!");
    }
}

/* LOAD MESSAGES */
async function loadMessages() {
    try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();

        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = "";

        data.forEach(msg => {
            if (!msg.message) return;

            const div = document.createElement("div");
            const isMe = msg.name === userName;

            div.className = "message " + (isMe ? "me" : "you");

            div.innerHTML = `
                <span class="sender">${isMe ? "Me" : msg.name}</span>
                ${msg.message}
            `;

            if (isMe) {
                div.onclick = () => deleteMsg(msg.id);
            }

            chatBox.appendChild(div);
        });

        chatBox.scrollTop = chatBox.scrollHeight;

    } catch (err) {
        console.log("Load error", err);
    }
}

/* SEND MESSAGE */
async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();

    if (!text) return;

    const msgId = "m" + Date.now();
    input.value = "";

    try {
        await fetch(SCRIPT_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "add",
                id: msgId,
                name: userName,
                message: text
            })
        });

        loadMessages();

    } catch (err) {
        console.log("Send error", err);
    }
}

/* DELETE MESSAGE */
async function deleteMsg(id) {
    if (!confirm("Delete this message?")) return;

    await fetch(SCRIPT_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            action: "delete",
            id: id
        })
    });

    loadMessages();
}
</script>

</body>
</html>
